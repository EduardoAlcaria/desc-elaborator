services:

  ollama:
    image: ollama/ollama:latest
    container_name: desc-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: desc-backend
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: desc-frontend
    ports:
      - "3030:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
