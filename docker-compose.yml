services:

  ollama:
    image: ollama/ollama:0.6.8
    container_name: desc-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "0s"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    profiles:
      - docker-ollama

  backend:
    build:
      context: ./backend
    container_name: desc-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: desc-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    deploy:
      resources:
        limits:
          memory: 64m
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  ollama_data:
